name: Android

# Chaque push et chaque pull request : tests JVM, lint et APK de débogage.
# Un tag « vX.Y.Z » : en plus, APK de publication signé, joint à une release GitHub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags compris : la version de l'application vient du dernier tag.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint et APK de débogage
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version du tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag « $GITHUB_REF_NAME » : attendu vX.Y.Z"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Clé de signature
        run: |
          # Sans clé, pas de release : un APK signé avec une clé jetable ne pourrait pas être mis à jour.
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "Secret RELEASE_KEYSTORE_BASE64 absent (voir README)."; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: APK de publication
        run: ./gradlew assembleRelease -PappVersion="$VERSION"
      - name: Vérifie la version et la signature de l'APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/aapt" dump badging "$APK" | grep -q "versionName='$VERSION'" || { echo "versionName ≠ $VERSION"; exit 1; }
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep -v "Android Debug" | grep -q "CN=Top Arena" || { echo "APK non signé avec la clé de publication"; exit 1; }
          cp "$APK" "TopArena-$VERSION.apk"
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "TopArena-$VERSION.apk" --title "Top Arena Mobile $VERSION" \
            --notes-file <(sed -n "/^## $VERSION/,/^## /{/^## /!p}" CHANGELOG.md) \
            || gh release upload "$GITHUB_REF_NAME" "TopArena-$VERSION.apk" --clobber
